[package]
name = "orama-rust-bm25-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
oramacore_fields = { version = "0.2.0", features = ["serde"] }
oramacore_lib = "0.4.4"
csv = "1"
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
